interface:
  display_name: "Maintainer"
  short_description: "Maintain skills and plugins, including metadata, description budget, consistency, and refresh workflows."
  brand_color: "#B85C00"
  default_prompt: "Run the requested maintenance workflow for one or more skills or plugins in this repository. Treat maintenance as one unified task: if the user gives no targets, do a repo-wide pass; if the user names skills or plugins, do targeted maintenance; if the user asks for metadata, docs, or description alignment, stay in metadata-only mode. For instruction-density reviews, propose lower-instruction equivalents first and do not refactor until approved."
