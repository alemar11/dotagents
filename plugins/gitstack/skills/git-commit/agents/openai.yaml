interface:
  display_name: "Git Commit"
  short_description: "Handle commit-only, commit-and-push, and push-only operations."
  brand_color: "#64748B"
  default_prompt: "Use $gitstack:git-commit when the user asks to commit, commit and push, push existing commits, or stage explicit paths. Resolve commit_operation as commit-only, commit-and-push, or push-only; never stage or commit during push-only. Use issue-closing trailers only for fully satisfied issues. Route issue-only GitHub comments, labels, type changes, follow-up creation, or manual closure to $gitstack:github-issues."
