interface:
  display_name: "Yeet"
  short_description: "Publish local work as a branch and draft PR, or hand off issue-only hygiene."
  brand_color: "#EA580C"
  default_prompt: "Use $gitstack:yeet to publish local work by inspecting scope, composing a commit through $gitstack:git-commit, pushing safely, and opening or reusing a draft PR with the GitHub connector or same-target gh fallback. Route issue-only work to $gitstack:github-issues."
