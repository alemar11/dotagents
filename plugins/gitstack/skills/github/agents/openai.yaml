interface:
  display_name: "GitHub"
  short_description: "Use when GitHub work is mixed or already-pushed; prefer `git`/`gh`, and resolve `ghflow` only for shared helpers."
  brand_color: "#1F9D55"
  icon_small: "./assets/github-small.svg"
  icon_large: "./assets/github.png"
  default_prompt: "Use the bundled GitHub skill to ensure both `git` and `gh` are installed, prefer direct `gh` commands for straightforward GitHub work, resolve the installed `ghflow` artifact before helper use, and use it only for failing-PR CI inspection, publish-context inspection, review-thread routing, authenticated-user stars or star lists, or other higher-level shared behavior."
