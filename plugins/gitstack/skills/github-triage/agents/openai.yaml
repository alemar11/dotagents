interface:
  display_name: "GitHub Triage"
  short_description: "Use when triaging GitHub repos, maintainer issue/PR queues, PR metadata, or authenticated-user stars/lists; prefer direct `gh`."
  brand_color: "#0F766E"
  icon_small: "./assets/github-small.svg"
  icon_large: "./assets/github.png"
  default_prompt: "Use the bundled GitHub Triage skill to produce URL-first current-repo maintainer triage reports for open issues and PRs, prefer direct `gh` commands for repository, issue, and PR work, keep report-only triage separate from implementation or mutation, and resolve the installed `ghflow` artifact only for authenticated-user stars and star lists."
