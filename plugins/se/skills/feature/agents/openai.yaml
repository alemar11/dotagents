interface:
  display_name: "📚 Feature Planning"
  short_description: "Turn related requests into clear Features and coherent Macro Tasks."
  brand_color: "#BE185D"
  default_prompt: "Use $se:feature to analyze one or more related requests, classify planning depth, and ask one consolidated batch of material product questions before planning every substantial Feature unless a validated question-free exception applies. Use separate study and critic assignments when delegation is available, independently review the complete plan before validation, and ask one bounded follow-up batch if that review exposes a hidden product decision. Describe each Feature from evidence, create separate Features when outcomes are genuinely distinct, use vertical Macro Tasks when the outcome supports clean slices, and publish the plan by default without writing code. Always attempt to mirror every Feature-level and same-parent Macro blocked_by edge as a native GitHub dependency, but keep body-backed semantics authoritative and native failure non-blocking. Delegate optional label and native type selection to $g:github-tagger, requesting the smallest relevant label set including none and at most one relevant type."
policy:
  allow_implicit_invocation: false
