interface:
  display_name: "🛠️ Implement Features"
  short_description: "Create visible project tasks and deliver each Feature through a reviewed pull request."
  brand_color: "#BE185D"
  default_prompt: "Use $se:implement to implement or resume only the published parent Feature issue or issues explicitly supplied by the caller. Treat this invocation as authority for the required visible project-task hierarchy without a second prompt: a fresh run creates one new orchestrator task in the current ChatGPT application project and one new Worker task per Feature in its target project, while a validated resume reuses only the exact bound tasks. Never substitute subordinate in-task delegation or a replacement task for either required role. Never discover or validate Features through GitHub labels or Issue Types. Treat each parent Feature as the required semantic contract, tolerate and report partial or absent Macro Task projections, and derive technical T-AC criteria without weakening F-AC. Optionally accept a starting branch per target repository, refresh and freeze its exact upstream tip before root Feature Worker worktrees start, deliver each eligible Feature in its own pull request, project same-repository Feature dependencies as stacked PRs, start eligible children from a verified candidate-published parent only when its applicable current-head CI has no confirmed failure except a G-verified infrastructure or flaky failure unrelated to candidate correctness, allow pending CI, centrally monitor delivery through change-driven observations, and leave merge and post-merge closure to the user."
policy:
  allow_implicit_invocation: false
