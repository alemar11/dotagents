interface:
  display_name: "🛠️ Implement Features"
  short_description: "Create visible project tasks and deliver each Feature through a reviewed pull request."
  brand_color: "#BE185D"
  default_prompt: "Use $se:implement for caller-supplied published parent Feature issues only. Fresh runs create one current-project orchestrator and one target-project Worker per Feature; resumes reuse exact bound tasks and delegation never substitutes. Treat each Feature and F-AC as required; report degraded Macro Task projections and derive T-AC without weakening F-AC. Before first PR use risk-gated pre-candidate convergence: for material risks, run one read-only consolidated critic pass, integrate actionable findings, freeze the candidate, then bind complete validation and native review to its exact SHA. Freeze any optional repository starting branch at its refreshed upstream tip before root Workers. Deliver one PR per Feature and stack same-repository dependencies. Start children from verified candidate-published parents only when exact-head CI has no confirmed candidate-related failure; pending CI is allowed and only G-verified infrastructure or flaky failures are exempt. Monitor centrally; do not merge."
policy:
  allow_implicit_invocation: false
