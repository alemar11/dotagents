interface:
  display_name: "🛠️ Implement Features"
  short_description: "Deliver planned Features through centrally monitored pull requests."
  brand_color: "#BE185D"
  default_prompt: "Use $se:implement to implement or resume a published Feature Plan Set. Deliver each eligible Feature in its own pull request, project same-repository Feature dependencies as stacked PRs, start eligible children from a verified candidate-published parent, centrally monitor delivery, and leave merge and post-merge closure to the user."
policy:
  allow_implicit_invocation: false
