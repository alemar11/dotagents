interface:
  display_name: "🛠️ Implement Features"
  short_description: "Create visible project tasks and deliver each Feature through a reviewed pull request."
  brand_color: "#BE185D"
  default_prompt: "Use $se:implement only for caller-supplied published parent Feature issues. Fresh runs create one visible orchestrator and one visible Worker per Feature; resumes reuse exact bound tasks. Load only the current role and phase contract. Workers own implementation through exact-HEAD native review; the orchestrator owns ledger, publication reservations, and hosted monitoring. Relay only material deltas, preserve exact-HEAD and recovery evidence, stack same-repository dependencies, and never merge."
policy:
  allow_implicit_invocation: false
