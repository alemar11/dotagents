interface:
  display_name: "🛠️ Implement Features"
  short_description: "Deliver planned Features through centrally monitored pull requests."
  brand_color: "#BE185D"
  default_prompt: "Use $se:implement to implement or resume only the published parent Feature issue or issues explicitly supplied by the caller. Never discover or validate Features through GitHub labels or Issue Types. Treat each parent Feature as the required semantic contract, tolerate and report partial or absent Macro Task projections, and derive technical T-AC criteria without weakening F-AC. Optionally accept a starting branch per target repository, refresh and freeze its exact upstream tip before root Feature Worker worktrees start, deliver each eligible Feature in its own pull request, project same-repository Feature dependencies as stacked PRs, start eligible children from a verified candidate-published parent, centrally monitor delivery, and leave merge and post-merge closure to the user."
policy:
  allow_implicit_invocation: false
