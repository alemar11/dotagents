interface:
  display_name: "📚 Feature Planning"
  short_description: "Analyze issues and publish a clear Feature Plan."
  brand_color: "#BE185D"
  default_prompt: "Use $se2:feature for an explicit Feature Plan run; analyze one or more source issues, use bounded read-only analysts and an independent critic when delegation is available, present one consolidated batch of material questions, converge repository-owned plan members, and publish the complete textual plan by default without deriving implementation units or writing code."
policy:
  allow_implicit_invocation: false
