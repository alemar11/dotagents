  short_description: "Write, scaffold, and validate Open Knowledge Format markdown bundles."
  brand_color: "#5B8C00"
  default_prompt: "Use $okf to write, scaffold, inspect, or validate Open Knowledge Format markdown bundles. Follow the bundled official OKF spec, distinguish spec-conformant validation from reference-agent-compatible validation, preserve unknown frontmatter fields, and use the shipped okf CLI when deterministic validation or scaffolding is needed."
