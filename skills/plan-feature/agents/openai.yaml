interface:
  display_name: "Plan Feature"
  short_description: "Manual feature planning into Product Requirements Documents (PRDs) and agent-ready issues."
  brand_color: "#10B981"
  default_prompt: "Use $plan-feature in full-flow mode by default for new feature intent: resolve only the required project-memory routing, defer repo-backed domain capture into a structured knowledge delta, write or publish the Product Requirements Document (PRD), then split it into hardened vertical issues with final integration and knowledge closeout. Use prd-only or issues-from-existing-prd only when the request explicitly calls for that mode."
policy:
  allow_implicit_invocation: false
