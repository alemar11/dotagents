interface:
  display_name: "Codex Orchestrator"
  short_description: "Coordinate workers with root-owned lifecycle, gates, ledgers, and closeout."
  brand_color: "#6A7F3F"
  default_prompt: "Use $codex-orchestrator to coordinate a portfolio of repositories, keep the root thread lightweight but in charge of lifecycle and closeout, route GitHub work to standalone companions such as $github-portfolio-triage, $github-triage, $github-issues, $github-deep-review, $github-ci, $github-review-threads, $github-releases, $git-commit, and $yeet, delegate only to authorized and inspectable worker surfaces, maintain the portfolio ledger, enforce delivery topology such as One Feature Branch or One PR Per Repo, and apply live-proof, closure, deferred-work, and risk follow-up gates."
