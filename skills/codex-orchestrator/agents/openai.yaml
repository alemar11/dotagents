interface:
  display_name: "Codex Orchestrator"
  short_description: "Explicitly coordinate source graphs, workers, gates, ledgers, and merge-ready closeout."
  brand_color: "#6A7F3F"
  default_prompt: "Use $codex-orchestrator only for explicit orchestration. Claim and reconcile the ledger, establish Goal mode or its fallback, route sources, dispatch bounded workers with exact capabilities, apply root-owned gates, and continue until completion or a real blocker. Pull-request delivery defaults to merge-ready with one verified Codex review per head; never merge without separate authority."
policy:
  allow_implicit_invocation: false
