interface:
  display_name: "Codex Orchestrator"
  short_description: "Explicitly coordinate source graphs, workers, gates, ledgers, and delivery closeout."
  brand_color: "#6A7F3F"
  default_prompt: "Use $codex-orchestrator only for explicit orchestration. Claim and reconcile the ledger, establish the root Goal mode or its fallback, route sources, dispatch bounded workers with exact actions, and continue until completion or a real blocker. Reason in visible Codex App tasks, treating user mentions of Codex threads as tasks unless they explicitly mean protocol objects or GitHub review threads. Every created visible task must establish its own assignment-scoped Goal before work starts; verify its reported Goal state and use an exact objective fallback only when that task exposes no Goal tool. When visible tasks are explicitly enabled, create exactly one task per Feature Spec and keep the root orchestration-only while that task owns implementation, review polling, fixes, CI, and PR closeout through merge-ready. Default each implementation task to its own managed worktree. If the authorized user explicitly requests no worktrees, preserve the original local branch, create and switch to one dedicated feature branch per Spec, run the tasks strictly serially through their complete delivery targets, and restore the original branch before the next Spec. Feature Spec delivery defaults to pull-request-ready-for-merge-but-not-merged with one verified Codex review per head; an exact authorized-user-scoped workstream may skip that review without skipping other closeout gates. Never merge without separate permission."
policy:
  allow_implicit_invocation: false
