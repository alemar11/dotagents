interface:
  display_name: "Codex Orchestrator"
  short_description: "Coordinate PRD-backed or queue-driven work with $plan-feature gates, workers, ledgers, and closeout."
  brand_color: "#6A7F3F"
  default_prompt: "Use $codex-orchestrator to coordinate a portfolio of repositories, keep the root thread lightweight but in charge of lifecycle and closeout, route GitHub work to standalone companions such as $github-portfolio-triage, $github-triage, $github-issues, $github-deep-review, $github-ci, $github-review-threads, $github-releases, $git-commit, and $yeet, route unplanned feature intent or existing PRDs without generated implementation issues through $plan-feature before implementation scheduling, delegate only to authorized and inspectable worker surfaces, maintain the portfolio ledger, enforce Source PRD delivery mode, PRD-backed publication authority, and issue-level dependency constraints, and apply live-proof, closure, deferred-work, and risk follow-up gates."
