interface:
  display_name: "Codex App Orchestrator"
  short_description: "Execute ready Feature Specs as merge-ready App PRs."
  brand_color: "#6A7F3F"
  default_prompt: "Use $codex-orchestrator only for explicit Codex App orchestration. First verify that the current runtime exposes visible Codex App task creation and App-managed worktree binding; local skill discovery, filesystem access, and generic subagents are not proof. If those App surfaces are absent or unverifiable, abort before asking permission, source intake, or artifact creation. Only after that gate passes, resolve visible-task permission from the invocation; if missing, ask once, and abort if permission is denied, unanswered, or cannot be requested. After permission is granted, validate one execution-ready bundle read-only: require a durable Feature Spec, complete generated implementation issues, and complete Orchestrator Handoffs. Never plan, repair, regenerate, publish, or accept ad-hoc implementation work. If the bundle is incomplete, return planning-required with exact missing evidence before claim, ledger, Goal, task, or mutation. For accepted bundles, acquire the active-root claim atomically through scripts/orchestrator-claim before ledger projection, Goal, task, worktree, or mutation. Then require the fixed conclusion pull-request-ready-for-merge-but-not-merged and run the GitHub PR capability preflight for every affected repository. Use only App-managed worktrees. Create exactly one managed visible task per Feature Spec and keep the root orchestration-only while the task implements, validates, publishes a draft PR, completes current-revision review and CI, resolves feedback, and marks every affected PR ready. Draft, uncommitted, commit-only, and push-only outcomes are never successful App conclusions. If task, managed checkout, GitHub publication, review, or CI capability is unavailable, abort as blocked without downgrading. Never fall back to root/background implementation or raw Git worktrees."
policy:
  allow_implicit_invocation: false
