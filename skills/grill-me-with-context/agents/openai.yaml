interface:
  display_name: "Grill Me With Context"
  short_description: "Stress-test repo-backed plans and capture or hand off durable decisions."
  brand_color: "#BE185D"
  default_prompt: "Use $grill-me-with-context to challenge this repo-backed plan through $grill-me and inspect existing code and docs first. Always use inline capture through $domain-modeling for direct invocation unless the user explicitly requests no documentation writes or deferred capture. Use defer-to-caller only when explicitly requested or passed by a parent workflow."
