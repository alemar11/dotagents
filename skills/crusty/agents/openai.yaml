interface:
  display_name: "Crusty · Independent Critic"
  short_description: "Self-contained skeptical critique of plans and decisions."
  brand_color: "#9A6B2F"
  default_prompt: "Use $crusty as a self-contained independent critic: do not adopt my preferred conclusion or framing, challenge this decision or evaluate this implementation from local or supplied evidence, report meaningful defects and test gaps, and recommend fixes without delegating to another skill or editing project files."
policy:
  allow_implicit_invocation: false
