interface:
  display_name: "Focus Task"
  short_description: "Create a focused new task from the latest discussion."
  brand_color: "#E11D48"
  default_prompt: "Use $focus-task to create one focused new task from a compact handoff of the latest substantive discussion. This invocation explicitly authorizes creating it directly in the uniquely matching saved project for repository work, or as a projectless task otherwise."
policy:
  allow_implicit_invocation: false
